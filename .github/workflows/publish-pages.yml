name: Request Council AI Pages rebuild
# Branch publishing handles pushes. Use this only for an explicit rebuild.
on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  request-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request the configured GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
