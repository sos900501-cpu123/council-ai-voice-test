<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTPS 음성인식 시험</title><style>body{font-family:system-ui;background:#10233c;color:white;padding:20px}button{font-size:20px;padding:15px;margin:8px}#result{white-space:pre-wrap;font-size:20px}</style></head><body><h2>🎙 HTTPS 음성인식 시험</h2><p>실제 업무자료는 사용하지 마세요. 브라우저 음성인식은 외부 서버로 음성이 전송될 수 있습니다.</p><p id="env"></p><button id="start">질의시작</button><button id="stop">질의종료</button><p id="status">대기 중</p><div id="result">인식된 문장 없음</div><script>let r;document.getElementById('env').textContent='보안 연결: '+(isSecureContext?'예':'아니오');document.getElementById('start').onclick=()=>{let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){document.getElementById('status').textContent='음성인식 미지원';return;}r=new S();r.lang='ko-KR';r.interimResults=true;r.continuous=true;r.onresult=e=>{document.getElementById('result').textContent=Array.from(e.results).map(x=>x[0].transcript).join(' ')};r.onerror=e=>document.getElementById('status').textContent='오류: '+e.error;r.onstart=()=>document.getElementById('status').textContent='듣는 중';r.start()};document.getElementById('stop').onclick=()=>{if(r)r.stop();document.getElementById('status').textContent='종료'};</script></body></html>
