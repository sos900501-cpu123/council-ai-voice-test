<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1729"><title>의회 AI V10.6 서버 연결 진단</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1729;color:#eaf2ff;font-family:system-ui,'Noto Sans KR',sans-serif;padding:22px}main{max-width:680px;margin:auto}h1{font-size:23px}.panel{background:#172a43;border:1px solid #35526e;border-radius:16px;padding:18px;margin:14px 0}button{background:#2875ae;border:0;color:#fff;font-weight:700;border-radius:10px;padding:13px 18px;font-size:16px}p{line-height:1.65}small{color:#c2d4eb}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#07101d;padding:14px;border-radius:10px}a{color:#9fdbff}.good{color:#83e7bb}.bad{color:#ffd18b}</style></head><body><main><h1>🛡️ 의회 AI V10.6 서버 진단</h1><p>공개 시험용 연결 검사입니다. 질문·업무자료·인증키를 입력하거나 외부로 전송하지 않습니다.</p><div class="panel"><strong>서버</strong><p id="server">council-ai-v106-api.sos900501.workers.dev</p><button id="check">서버 연결 확인</button><p id="result" role="status" aria-live="polite">검사 전</p><pre id="detail" hidden></pre></div><div class="panel"><strong>안전 상태</strong><p>GPT 호출: 이 진단 페이지에서는 실행하지 않음</p><p>업무자료 전송: 없음</p><p>인증 토큰 저장: 없음</p><small>서버의 /health 응답만으로 실제 인증·호출 제한 설정이 검증되지는 않습니다.</small></div><p><a href="./council_ai_v10_4_https_demo.html">기존 음성 시험판으로 돌아가기</a></p></main><script>
const base='https://council-ai-v106-api.sos900501.workers.dev';
document.getElementById('check').addEventListener('click',async()=>{
 const button=document.getElementById('check'),out=document.getElementById('result'),detail=document.getElementById('detail');
 button.disabled=true;out.textContent='연결 확인 중…';detail.hidden=true;
 try{
  const response=await fetch(base+'/health',{method:'GET',cache:'no-store',mode:'cors'});
  const data=await response.json();
  if(response.ok&&data.ok===true&&data.version==='10.6'){
   out.className='good';out.textContent='✅ V10.6 서버 연결 성공 · GPT 상태: '+String(data.mode||'알 수 없음');
  }else{out.className='bad';out.textContent='⚠️ 서버 응답 확인 필요 (HTTP '+response.status+')'}
  detail.textContent=JSON.stringify(data,null,2);detail.hidden=false;
 }catch(e){out.className='bad';out.textContent='⚠️ 브라우저 연결 실패: '+String(e.message||e)}
 finally{button.disabled=false}
});
</script></body></html>
